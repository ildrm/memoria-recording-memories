services:
  app:
    build:
      context: .
      target: development
    env_file: .env
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: memoria
      DB_USERNAME: memoria
      DB_PASSWORD: memoria-local
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_QUEUE_RETRY_AFTER: 960
      REDIS_HOST: redis
      SESSION_DRIVER: redis
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    extends:
      service: app
    command: php artisan queue:work --queue=security,maintenance,default,social,exports,notifications --sleep=1 --tries=3 --timeout=120
    ports: !reset []
    volumes:
      - worker_vendor:/var/www/html/vendor

  scheduler:
    extends:
      service: app
    command: php artisan schedule:work
    ports: !reset []
    volumes:
      - scheduler_vendor:/var/www/html/vendor

  node:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: memoria
      POSTGRES_USER: memoria
      POSTGRES_PASSWORD: memoria-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoria -d memoria"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  app_vendor:
  node_modules:
  postgres_data:
  redis_data:
  scheduler_vendor:
  worker_vendor:
